name: Publicar versão

# Ao enviar uma tag como v0.3.0, gera o APK e publica na página de Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: APK na página de Releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: APK
        run: flutter build apk --release

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="gm-fitness-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          cat > notas.md <<'EOF'
          ## Como instalar no Android

          1. No celular, toque em **gm-fitness-…apk** logo abaixo, em *Assets*, para baixar.
          2. Abra o arquivo baixado. Se o Android pedir, permita **instalar apps desconhecidos** para o navegador ou o gerenciador de arquivos.
          3. Toque em **Instalar**.

          Se já tiver uma versão anterior instalada e o Android disser que o app não pode ser atualizado, desinstale a antiga primeiro. Isso apaga a lista de treinos salva no celular.
          EOF
          sed -i 's/^          //' notas.md
          gh release create "$TAG" "$APK" --title "GM Fitness ${TAG}" --notes-file notas.md
