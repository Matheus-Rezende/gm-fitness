name: Publicar versão

# Quando o campo version do pubspec.yaml muda na main, gera o APK e publica
# uma Release com a tag v<versão>. Também pode ser disparado à mão na aba Actions.
# O APK é assinado com a chave fixa dos segredos ANDROID_KEYSTORE_*.
on:
  push:
    branches: [main]
    paths: ['pubspec.yaml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: APK na página de Releases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A versão ${TAG} já foi publicada."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.ver.outputs.exists == 'false'
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Chave de assinatura
        if: steps.ver.outputs.exists == 'false'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64. Sem a chave fixa, o APK não instala por cima da versão anterior. Veja 'Assinatura do APK' no README."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/gm-fitness.jks"
          echo "GM_KEYSTORE_PATH=$RUNNER_TEMP/gm-fitness.jks" >> "$GITHUB_ENV"

      - name: APK
        if: steps.ver.outputs.exists == 'false'
        env:
          GM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publicar
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          APK="gm-fitness-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          VERSION="${TAG#v}"
          {
            awk -v v="$VERSION" '
              $0 ~ "^## " { if (on) exit; if ($2 == v) { on = 1; next } }
              on { print }
            ' CHANGELOG.md
            echo
            echo "## Como instalar no Android"
            echo
            echo "1. No celular, toque em **${APK}** logo abaixo, em *Assets*, para baixar."
            echo "2. Abra o arquivo baixado. Se o Android pedir, permita **instalar apps desconhecidos** para o navegador ou o gerenciador de arquivos."
            echo "3. Toque em **Instalar**."
            echo
            echo "Com o app instalado, as próximas versões aparecem sozinhas: o GM Fitness avisa e atualiza com um toque, sem perder seus dados."
            echo
            echo "Quem tem a versão 0.4.0 ou anterior precisa desinstalar a antiga uma única vez antes de instalar esta, porque a assinatura do app mudou. Isso apaga a lista de treinos salva no celular."
          } > notas.md
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "GM Fitness ${TAG}" --notes-file notas.md
