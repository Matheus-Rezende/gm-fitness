name: Verificar e gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pastas de plataforma
        run: flutter create . --project-name gm_fitness --org com.gmfitness --platforms=android

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Prévias das animações
        run: RENDER_PREVIEWS=1 flutter test test/render_preview_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: previas-animacoes
          path: build/previews/
          retention-days: 7

      - name: APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gm-fitness-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
