name: Verificar e compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  android:
    name: Análise, testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: Prévias das animações
        run: RENDER_PREVIEWS=1 flutter test test/render_preview_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: previas-animacoes
          path: build/previews/
          retention-days: 7

      - name: APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gm-fitness-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: Compilação iOS (sem assinatura)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign
